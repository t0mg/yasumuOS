name: yasumuOS CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:

jobs:
  test-x86_64:
    name: Native x86_64 Unit, Portal & Headless SDL2 Tests
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run unit & end-to-end integration tests
        run: cargo test --all-targets

  cross-compile-arm64:
    name: ARM64 (aarch64-unknown-linux-gnu) Cross-Compile & .muxapp Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross toolchain & SDL2 sysroot
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libsdl2-dev:arm64 \
            pkg-config \
            zip
      - name: Install Rust toolchain with aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build aarch64 release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          QUOS_SDL2_LIB_DIR: /usr/lib/aarch64-linux-gnu
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Package muOS .muxapp & tarball
        run: ./scripts/package-release.sh target/aarch64-unknown-linux-gnu/release/yasumu
      - name: Upload deployable archives
        uses: actions/upload-artifact@v4
        with:
          name: yasumuOS-release
          path: |
            dist/yasumuOS.muxapp
            dist/yasumuOS-installer.tar.gz

  release:
    name: Publish GitHub Release
    needs: [test-x86_64, cross-compile-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: yasumuOS-release
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/yasumuOS.muxapp \
            dist/yasumuOS-installer.tar.gz \
            --title "yasumuOS $GITHUB_REF_NAME" \
            --generate-notes
