# yasumuOS Locked-Down RetroArch Override for MustardOS (muOS-Keys)
# Disables in-game RetroArch menus/hotkeys, configures muOS-Keys player 1 controls
# (including analog sticks for H700 stick devices), and maps double-tap MENU to
# clean auto-save exit so MENU + VOL+/- brightness keeps working.

input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "false"
input_player1_joypad_index = "0"

# Official muOS-Keys udev button & analog layout (Anbernic H700 family)
input_player1_a_btn = "0"
input_player1_b_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"

# Lock down in-game RetroArch menu and hotkeys
auto_overrides_enable = "false"
input_menu_toggle = "nul"
input_menu_toggle_btn = "nul"
input_enable_hotkey = "nul"
input_enable_hotkey_btn = "nul"

# Dedicated MENU button (btn 10 in udev) exits game on double-tap
# (quit_press_twice = "true" preserves holding MENU + VOL+/VOL- for brightness without exiting)
input_exit_emulator_btn = "10"
quit_press_twice = "true"

# Automatic save state on exit and automatic load on game launch
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_directory = "/mnt/mmc/MUOS/save/state"
savefile_directory = "/mnt/mmc/MUOS/save/file"
config_save_on_exit = "false"

# Local UDP Command Interface for mid-game 5m/1m OSD warnings (SHOW_MSG) and quota/bedtime enforcement (QUIT)
network_cmd_enable = "true"
network_cmd_port = "55355"

# Crisp TrueType OSD notifications at top of display in Signal Orange (per-system font size set dynamically by yasumu)
menu_enable_widgets = "false"
video_font_enable = "true"
video_font_size = "36.000000"
video_message_pos_x = "0.050000"
video_message_pos_y = "0.880000"
video_message_color = "ff6600"
video_msg_bgcolor_enable = "true"
video_msg_bgcolor_red = "10"
video_msg_bgcolor_green = "15"
video_msg_bgcolor_blue = "30"
video_msg_bgcolor_opacity = "0.880000"
