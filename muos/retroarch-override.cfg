# yasumuOS Locked-Down RetroArch Override for MustardOS (muOS)
# Device-agnostic: keeps RetroArch autoconfig enabled (using sanitized autoconfigs
# generated at launch in /tmp/yasumu-autoconfig) so D-pad, face buttons, shoulders,
# and analog sticks work on any muOS handheld while in-game menus/hotkeys stay locked.

input_autodetect_enable = "true"
input_player1_joypad_index = "0"

# Lock down in-game RetroArch menu and hotkeys
input_menu_toggle = "nul"
input_menu_toggle_btn = "nul"
input_enable_hotkey = "nul"
input_enable_hotkey_btn = "nul"

# Double-tap MENU exits game cleanly (preserving MENU + VOL+/- brightness hold)
# Exact input_exit_emulator_btn is injected per-device at launch in /tmp/yasumu-lang.cfg
quit_press_twice = "true"

# Automatic save state on exit and automatic load on game launch
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_directory = "/mnt/mmc/MUOS/save/state"
savefile_directory = "/mnt/mmc/MUOS/save/file"
config_save_on_exit = "false"

# Local UDP Command Interface for mid-game 5m/1m OSD warnings (SHOW_MSG) and quota/bedtime enforcement (QUIT)
network_cmd_enable = "true"
network_cmd_port = "55355"

# Crisp TrueType OSD notifications at top of display in Signal Orange (per-system font size set dynamically by yasumu)
menu_enable_widgets = "false"
video_font_enable = "true"
video_font_size = "36.000000"
video_message_pos_x = "0.050000"
video_message_pos_y = "0.880000"
video_message_color = "ff6600"
video_msg_bgcolor_enable = "true"
video_msg_bgcolor_red = "10"
video_msg_bgcolor_green = "15"
video_msg_bgcolor_blue = "30"
video_msg_bgcolor_opacity = "0.880000"
